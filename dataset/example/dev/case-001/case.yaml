id: case-001
name: Analyze technical specification

category: analysis
severity: major

prompt: |
  Изучи техническое задание.
  Найди противоречия и недостающие требования.
  Сформируй отчёт.

execution:
  mode: text

inputs:
  - inputs/requirements.md

reference:
  - reference/answer.md

expected_outputs:
  - path: answer.md
    type: text
    required: true

checks:
  required_sections:
    - противоречия
    - рекомендации

rubric:
  criteria:

    - name: correctness
      points: 50
      levels:
        - range: [0, 20]
          description: Причина определена неверно.

        - range: [21, 40]
          description: Основная проблема найдена, но объяснение неполное.

        - range: [41, 50]
          description: Причина определена и объяснена корректно.

    - name: completeness
      points: 30
      levels:
        - range: [0, 10]
          description: Большая часть требований не выполнена.

        - range: [11, 20]
          description: Основные требования выполнены.

        - range: [21, 30]
          description: Все существенные требования выполнены.

    - name: clarity
      points: 20
      levels:
        - range: [0, 7]
          description: Ответ трудно понять.

        - range: [8, 14]
          description: Ответ в целом понятен.

        - range: [15, 20]
          description: Ответ ясный и хорошо структурированный.